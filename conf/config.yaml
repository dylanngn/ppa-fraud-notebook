defaults:
  - _self_
  - data: default
  - features: baseline
  - model: xgboost

experiment_name: "ppa-fraud-detection"
seed: 42

# Hydra configuration
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
