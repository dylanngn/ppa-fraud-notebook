# Standard Profile - Good balance of speed and performance
# Uses Tier 1 (core) + Tier 1b (boolean) + Tier 2 (graph) features
# Expected: ~20min training, ~0.67 AUC-PR

defaults:
  - _self_

profile: standard
description: "Balanced speed and performance - core + boolean + graph features"

# Feature categories to compute
categories:
  - base
  - graph
  - advanced_graph

# Feature groups to INCLUDE
include_groups:
  - core_numerical
  - boolean_all        # All boolean indicators
  - graph_all          # All graph features
