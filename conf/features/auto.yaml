# Auto Profile - Simplified feature selection (DEFAULT)
#
# Uses ALL tabular columns from raw data + explicit graph features.
# Validated by Experiment 9: 0.784 AUC-PR
#
# Benefits:
#   - Simple pipeline (no manual feature curation)
#   - New ETL fields automatically included

defaults:
  - _self_

profile: auto
description: "Auto tabular + graph features"

categories:
  - base   # Derived tabular features (account_age_days, log_price, booleans)
  - graph  # All 17 graph features (contact reuse, pagerank, etc.)
