# Baseline Profile - Production Ready (alias for production)
# Based on data quality analysis: data_quality_reports/data_quality_report.txt
#
# Feature Tiers:
#   - Tier 1 (core_numerical): Core features, 100% coverage, essential
#   - Tier 1b (boolean_all): Boolean indicators, 100% semantic coverage
#   - Tier 2 (graph_all): +11.9% AUC-PR improvement
#   - Tier 3 (time_weighted, text): +0.98% incremental improvement

defaults:
  - _self_

profile: baseline
description: "Standard baseline configuration - equivalent to production profile"

# Feature categories to compute
categories:
  - base
  - graph
  - advanced_graph
  - time_weighted
  - text

# Feature groups to INCLUDE
include_groups:
  - core_numerical
  - boolean_all
  - graph_all
  - time_weighted_core
  - text
