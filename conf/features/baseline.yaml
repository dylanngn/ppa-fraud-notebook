# Feature configuration (Baseline - Production Ready)
# Based on data quality analysis: data_quality_reports/data_quality_report.txt
#
# Feature Tiers:
#   - Tier 1 (base): Core features, 100% coverage, essential
#   - Tier 2 (graph, advanced_graph): +11.9% AUC-PR improvement
#   - Tier 3 (time_weighted, text): +0.98% incremental improvement
#
# Profiles available: quick, standard, production, ablation
# Use: python src/cli.py train-baseline --feature-config conf/features/{profile}.yaml

defaults:
  - _self_

profile: baseline
description: "Standard baseline configuration - equivalent to production profile"

# Feature categories to include
# Note: interaction features excluded (XGBoost learns these automatically per Exp 10)
categories:
  - base
  - graph
  - advanced_graph
  - time_weighted
  - text

# Exclude low-coverage and deprecated features based on data quality analysis
exclude:
  # Low coverage features (>40% NULL - unreliable signal)
  - is_new               # 99.99% NULL
  - has_elevator         # ~60% NULL
  
  # Burst detection (Exp 9: proven ineffective, didn't appear in top 20 features)
  - email_is_burst
  - phone_is_burst
  - any_burst
  - email_is_dormant_reactivation
  - phone_is_dormant_reactivation
  - any_dormant_reactivation
