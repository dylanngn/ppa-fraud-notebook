# Baseline Profile - Core + Graph features only (no enhanced features)
# Use this as the control group for ablation experiments.
#
# Difference from production:
#   - EXCLUDES time_weighted_core and text features
#   - Expected: Slightly lower AUC-PR (~0.98% less than production)
#
# Use production.yaml for best performance in deployment.

defaults:
  - _self_

profile: baseline
description: "Core + Graph only (excludes time-weighted and text for ablation baseline)"

# Feature categories to compute (no time_weighted or text)
categories:
  - base
  - graph
  - advanced_graph

# Feature groups to INCLUDE (no time_weighted_core or text)
include_groups:
  - core_numerical
  - boolean_all
  - graph_all
