# Production Profile - Best performance for deployment
# Uses all proven features: Tier 1 (core) + Tier 1b (boolean) + Tier 2 (graph) + Tier 3 (enhanced)
# Expected: ~25min training, ~0.70+ AUC-PR

defaults:
  - _self_

profile: production
description: "Best performance for production deployment - all proven features"

# Feature categories to compute (generators to run)
categories:
  - base
  - graph
  - advanced_graph
  - time_weighted
  - text

# Feature groups to INCLUDE (explicit, no exclusions)
# See src/models/config/constants.py for group definitions
include_groups:
  # Tier 1: Core numerical features
  - core_numerical
  
  # Tier 1b: Boolean indicators (100% semantic coverage, NULL = FALSE)
  - boolean_all        # All 12 boolean features
  
  # Tier 2: Graph-derived features
  - graph_all          # Basic + advanced graph features
  
  # Tier 3: Enhanced features
  - time_weighted_core # Proven time-weighted features
  - text               # Text analysis features
