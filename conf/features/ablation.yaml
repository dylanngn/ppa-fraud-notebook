# Ablation Study Profile - For systematic feature importance analysis
# Run experiments with different feature GROUP combinations to measure impact

defaults:
  - _self_

profile: ablation
description: "Systematic feature ablation study using explicit feature groups"

# Define ablation experiments (each experiment includes specific groups)
ablation_experiments:
  
  # ==========================================================================
  # TIER ABLATIONS: Test value of each tier
  # ==========================================================================
  
  tier1_numerical_only:
    description: "Core numerical features only (no booleans, no graph)"
    include_groups:
      - core_numerical
    categories:
      - base
    expected_auc_pr: 0.55
    
  tier1_with_boolean_high:
    description: "Core + high TRUE rate booleans (>40%)"
    include_groups:
      - core_numerical
      - boolean_high
    categories:
      - base
    expected_auc_pr: 0.58
    
  tier1_with_boolean_all:
    description: "Core + all boolean indicators"
    include_groups:
      - core_numerical
      - boolean_all
    categories:
      - base
    expected_auc_pr: 0.59
    
  tier1_plus_graph_basic:
    description: "Core + booleans + basic graph features"
    include_groups:
      - core_numerical
      - boolean_all
      - graph_basic
    categories:
      - base
      - graph
    expected_auc_pr: 0.64
    
  tier1_plus_graph_all:
    description: "Core + booleans + all graph features (standard)"
    include_groups:
      - core_numerical
      - boolean_all
      - graph_all
    categories:
      - base
      - graph
      - advanced_graph
    expected_auc_pr: 0.67
    
  production:
    description: "Full production config"
    include_groups:
      - core_numerical
      - boolean_all
      - graph_all
      - time_weighted_core
      - text
    categories:
      - base
      - graph
      - advanced_graph
      - time_weighted
      - text
    expected_auc_pr: 0.70

  # ==========================================================================
  # BOOLEAN ABLATIONS: Test value of different boolean groups
  # ==========================================================================
  
  no_booleans:
    description: "Ablation: Remove ALL boolean features"
    include_groups:
      - core_numerical
      - graph_all
    categories:
      - base
      - graph
      - advanced_graph
    expected_auc_pr: 0.65
    
  boolean_low_only:
    description: "Ablation: Only low TRUE rate booleans (<20%) - test rare feature value"
    include_groups:
      - core_numerical
      - boolean_low
      - graph_all
    categories:
      - base
      - graph
      - advanced_graph
    expected_auc_pr: null  # TBD
    
  boolean_moderate_and_high:
    description: "Ablation: Moderate + high TRUE rate booleans"
    include_groups:
      - core_numerical
      - boolean_high
      - boolean_moderate
      - graph_all
    categories:
      - base
      - graph
      - advanced_graph
    expected_auc_pr: null  # TBD

  # ==========================================================================
  # GRAPH ABLATIONS: Test value of different graph features
  # ==========================================================================
  
  no_graph:
    description: "Ablation: Remove ALL graph features"
    include_groups:
      - core_numerical
      - boolean_all
    categories:
      - base
    expected_auc_pr: 0.59
    
  graph_basic_only:
    description: "Ablation: Only basic graph features (no advanced)"
    include_groups:
      - core_numerical
      - boolean_all
      - graph_basic
    categories:
      - base
      - graph
    expected_auc_pr: 0.64

# Default: run specific experiments (prioritized)
run_experiments:
  # Priority 1: Boolean ablation (new insight from data quality)
  - no_booleans
  - tier1_with_boolean_all
  - boolean_low_only
  
  # Priority 2: Tier comparison
  - tier1_numerical_only
  - tier1_plus_graph_all
  - production

# Metrics to track per experiment
metrics:
  - auc_pr
  - precision_at_100
  - feature_count
  - training_time_seconds
