# High-Recall XGBoost HPO Config
# Optimizes for F1 at high recall (>90%)
# Uses higher scale_pos_weight range to favor catching fraud

defaults:
  - experiment
  - override hydra/sweeper: optuna
  - _self_

experiment:
  name: "HPO_HighRecall"

training:
  gap_days: 7
  # Target recall threshold for optimization
  target_recall: 0.95

model:
  variant: "vanilla_xgboost"

hydra:
  mode: MULTIRUN
  
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
      multivariate: true
    
    direction: maximize  # Still maximize AUC-PR, but with higher scale_pos_weight
    
    study_name: high_recall_hpo
    storage: null
    
    n_trials: 50
    n_jobs: 1
    
    params:
      model.xgboost.n_estimators: range(100, 500, step=50)
      model.xgboost.max_depth: range(4, 10)
      model.xgboost.learning_rate: interval(0.01, 0.2)
      model.xgboost.min_child_weight: range(1, 5)
      model.xgboost.subsample: interval(0.7, 1.0)
      model.xgboost.colsample_bytree: interval(0.7, 1.0)
      model.xgboost.gamma: interval(0.0, 2.0)
      model.xgboost.reg_alpha: interval(0.0, 1.0)
      model.xgboost.reg_lambda: interval(0.5, 2.0)
      
      # Higher scale_pos_weight for high recall
      # Fraud rate ~2%, so theoretical optimal is ~50
      model.xgboost.scale_pos_weight: interval(10.0, 80.0)

  sweep:
    dir: mlruns/hpo_high_recall/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: trial_${hydra.job.num}
