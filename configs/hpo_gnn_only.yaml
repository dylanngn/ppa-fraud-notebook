# GNN-Only HPO Config
# Uses best XGBoost params (from previous HPO) and only tunes GNN
# 
# Much faster than joint HPO - only searches GNN hyperparameters

defaults:
  - experiment
  - override hydra/sweeper: optuna
  - _self_

experiment:
  name: "HPO_GNN_Only"

training:
  gap_days: 7

model:
  variant: "gnn_xgboost"
  
  # Best XGBoost params from HPO (override with actual values)
  # These will be overridden by Makefile or command line
  xgboost:
    n_estimators: 400
    max_depth: 10
    learning_rate: 0.077
    min_child_weight: 5
    subsample: 0.9
    colsample_bytree: 0.86
    gamma: 1.34
    reg_alpha: 0.01
    reg_lambda: 0.88
    scale_pos_weight: 12.0

hydra:
  mode: MULTIRUN
  
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 5
      multivariate: true
    
    direction: maximize  # Maximize AUC-PR
    
    study_name: gnn_only_hpo
    storage: null
    
    n_trials: 20
    n_jobs: 1
    
    params:
      # Only tune GNN parameters
      model.gnn.hidden_dim: choice(32, 64, 128, 256)
      model.gnn.output_dim: choice(16, 32, 64)
      model.gnn.num_layers: range(1, 4)
      model.gnn.epochs: range(10, 50, step=10)

  sweep:
    dir: mlruns/hpo_gnn_only/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: trial_${hydra.job.num}
