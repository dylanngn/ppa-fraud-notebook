# GNN-Only HPO Config
# Uses best XGBoost params (from previous HPO) and only tunes GNN
# 
# Much faster than joint HPO - only searches GNN hyperparameters

defaults:
  - experiment
  - override hydra/sweeper: optuna
  - _self_

mlflow:
  experiment_name: "fraud-detection-hpo"
  registered_model_name: null

training:
  gap_days: 7

model:
  variant: "gnn_xgboost"
  
  # Best XGBoost params from HPO (2025-12-19)
  xgboost:
    n_estimators: 500
    max_depth: 12
    learning_rate: 0.151
    min_child_weight: 8
    subsample: 0.818
    colsample_bytree: 0.985
    gamma: 0.236
    reg_alpha: 0.078
    reg_lambda: 0.406
    scale_pos_weight: 5.297

hydra:
  mode: MULTIRUN
  
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 5
      multivariate: true
    
    direction: maximize  # Maximize AUC-PR
    
    study_name: gnn_only_hpo
    storage: null
    
    n_trials: 20
    n_jobs: 1
    
    params:
      # Only tune GNN parameters
      model.gnn.hidden_dim: choice(32, 64, 128, 256)
      model.gnn.output_dim: choice(16, 32, 64)
      model.gnn.num_layers: range(1, 4)
      model.gnn.epochs: range(10, 50, step=10)

  sweep:
    dir: mlruns/hpo_gnn_only/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: trial_${hydra.job.num}
