# GNN + XGBoost Joint HPO Config
# Tunes both GNN embeddings and XGBoost classifier together
# 
# Note: This is slower than XGBoost-only HPO because each trial 
# needs to train the GNN first. Consider using fewer trials.

defaults:
  - experiment
  - override hydra/sweeper: optuna
  - _self_

experiment:
  name: "HPO_GNN_XGBoost"

training:
  gap_days: 7

model:
  variant: "gnn_xgboost"

hydra:
  mode: MULTIRUN
  
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 5  # Fewer startup due to slower training
      multivariate: true
    
    direction: maximize  # Maximize AUC-PR
    
    study_name: gnn_xgboost_hpo
    storage: null
    
    # Fewer trials due to slower GNN training
    n_trials: 30
    n_jobs: 1
    
    params:
      # ==========================================
      # GNN Hyperparameters
      # ==========================================
      model.gnn.hidden_dim: choice(32, 64, 128)
      model.gnn.output_dim: choice(16, 32, 64)
      model.gnn.num_layers: range(1, 4)
      model.gnn.epochs: range(5, 30, step=5)
      
      # ==========================================
      # XGBoost Hyperparameters
      # ==========================================
      model.xgboost.n_estimators: range(100, 400, step=50)
      model.xgboost.max_depth: range(4, 10)
      model.xgboost.learning_rate: interval(0.03, 0.2)
      model.xgboost.min_child_weight: range(1, 7)
      model.xgboost.subsample: interval(0.7, 1.0)
      model.xgboost.colsample_bytree: interval(0.7, 1.0)
      model.xgboost.gamma: interval(0.0, 2.0)
      model.xgboost.scale_pos_weight: interval(1.0, 20.0)

  sweep:
    dir: mlruns/hpo_gnn/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: trial_${hydra.job.num}
