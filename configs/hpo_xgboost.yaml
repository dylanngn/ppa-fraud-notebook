# XGBoost Hyperparameter Optimization Config
# Uses hydra-optuna-sweeper for Bayesian optimization

defaults:
  - experiment
  - override hydra/sweeper: optuna
  - _self_

# HPO-specific experiment settings
experiment:
  name: "HPO_XGBoost"

# Fixed training settings for HPO
training:
  gap_days: 7

# Model variant (can be overridden)
model:
  variant: "vanilla_xgboost"

# Hydra Optuna Sweeper Configuration
hydra:
  mode: MULTIRUN
  
  sweeper:
    # Optuna sampler configuration
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10  # Random trials before TPE kicks in
      multivariate: true    # Consider parameter correlations
    
    # Optimization direction
    direction: maximize
    
    # Study configuration
    study_name: xgboost_hpo
    storage: null  # In-memory (can use sqlite for persistence)
    
    # Number of trials
    n_trials: 50
    n_jobs: 1  # Sequential (set higher for parallel)
    
    # Search space definition
    params:
      # Core XGBoost hyperparameters
      model.xgboost.n_estimators: range(50, 500, step=50)
      model.xgboost.max_depth: range(3, 12)
      model.xgboost.learning_rate: interval(0.01, 0.3)
      model.xgboost.min_child_weight: range(1, 10)
      model.xgboost.subsample: interval(0.6, 1.0)
      model.xgboost.colsample_bytree: interval(0.6, 1.0)
      model.xgboost.gamma: interval(0.0, 5.0)
      model.xgboost.reg_alpha: interval(0.0, 2.0)
      model.xgboost.reg_lambda: interval(0.0, 2.0)
      
      # Scale pos weight for class imbalance (fraud is minority)
      model.xgboost.scale_pos_weight: interval(1.0, 20.0)

  # Sweep output directory
  sweep:
    dir: mlruns/hpo/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: trial_${hydra.job.num}
