# Experiment Configuration
# Single-model training with fixed train/test split

defaults:
  - _self_

experiment:
  name: "fraud_detection"
  tracking_uri: "sqlite:///ppa-fraud-detection-mlflow.db"
  artifact_location: "mlruns"

data:
  path: "artifacts/merged_events.parquet"
  # Fixed train/test split for controlled A/B comparisons
  # Note: SEON data starts 2024-11-16, so use 2024-12-01 as safe start
  train_start_date: "2024-12-01"  # Exclude incomplete early data
  train_end_date: "2025-06-01"    # Train on data up to this date
  test_end_date: "2025-07-01"     # Test on data from train_end + gap to this date

training:
  gap_days: 7  # Gap between train and test to prevent leakage

model:
  variant: "vanilla_xgboost"  # vanilla_xgboost or gnn_xgboost
  
  xgboost:
    n_estimators: 100
    max_depth: 3
    learning_rate: 0.1
    min_child_weight: 1
    subsample: 1.0
    colsample_bytree: 1.0
    gamma: 0.0
    reg_alpha: 0.0
    reg_lambda: 1.0
    scale_pos_weight: 1.0
    
  gnn:
    device: "cpu"
    hidden_dim: 32
    output_dim: 16
    num_layers: 2
    epochs: 5
