# Experiment Configuration
# Single-model training with fixed train/test split

defaults:
  - _self_

experiment:
  name: "fraud_detection"
  tracking_uri: "sqlite:///ppa-fraud-detection-mlflow.db"
  artifact_location: "mlruns"

data:
  path: "artifacts/merged_events.parquet"
  # Fixed train/test split for controlled A/B comparisons
  # Note: SEON data starts 2024-11-16, so use 2024-12-01 as safe start
  train_start_date: "2024-12-01"  # Exclude incomplete early data
  train_end_date: "2025-06-01"    # Train on data up to this date
  test_end_date: "2025-07-01"     # Test on data from train_end + gap to this date

training:
  mode: "single"  # "single" or "expanding"
  gap_days: 7  # Gap between train and test to prevent leakage
  run_shap: false  # Set to true to run SHAP analysis after training

# Expanding window configuration (for mode="expanding")
expanding_window:
  window_days: 30  # Length of each test window
  min_train_windows: 2  # Minimum training windows before first evaluation

model:
  # Variants: logistic_regression, random_forest, vanilla_xgboost, gnn_xgboost
  variant: "vanilla_xgboost"
  
  # Logistic Regression baseline
  logistic_regression:
    C: 1.0
    max_iter: 1000
    class_weight: "balanced"
  
  # Random Forest baseline
  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
  
  # XGBoost (main model) - Best HPO parameters (2025-12-19)
  xgboost:
    n_estimators: 500
    max_depth: 12
    learning_rate: 0.151
    min_child_weight: 8
    subsample: 0.818
    colsample_bytree: 0.985
    gamma: 0.236
    reg_alpha: 0.078
    reg_lambda: 0.406
    scale_pos_weight: 5.297
    
  # GNN embedder - Best HPO parameters (2025-12-19)
  gnn:
    encoder: "graphsage"  # "graphsage", "hgt", or "care"
    device: "cpu"
    hidden_dim: 32
    output_dim: 16
    num_layers: 2
    num_heads: 4  # For HGT only
    similarity_dim: 32  # For CARE-GNN only
    epochs: 10
    supervised: true  # true = node classification, false = link prediction
